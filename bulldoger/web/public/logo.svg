<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">BullDOGEr: a bulldozer with a corgi's head on the front</title>
  <!-- exhaust stack -->
  <rect x="58" y="62" width="10" height="34" rx="3" fill="#3a3a3a"/>
  <circle cx="58" cy="52" r="6" fill="#d9d9d9" opacity=".7"/>
  <circle cx="48" cy="42" r="8" fill="#d9d9d9" opacity=".5"/>
  <!-- cab -->
  <path d="M78 62 h46 a6 6 0 0 1 6 6 v44 h-58 v-44 a6 6 0 0 1 6 -6z" fill="#f5b700" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round"/>
  <rect x="86" y="72" width="34" height="28" rx="4" fill="#bfe6ff" stroke="#2b2b2b" stroke-width="4"/>
  <path d="M92 78 l10 0" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- body -->
  <path d="M30 110 h118 a8 8 0 0 1 8 8 v40 h-134 v-40 a8 8 0 0 1 8 -8z" fill="#f5b700" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round"/>
  <rect x="38" y="122" width="44" height="8" rx="4" fill="#2b2b2b" opacity=".25"/>
  <!-- push arm to the corgi -->
  <path d="M150 140 L176 150" stroke="#2b2b2b" stroke-width="12" stroke-linecap="round"/>
  <!-- tracks -->
  <rect x="18" y="158" width="150" height="46" rx="23" fill="#3a3a3a" stroke="#2b2b2b" stroke-width="5"/>
  <g fill="#8a8a8a" stroke="#2b2b2b" stroke-width="3">
    <circle cx="42" cy="181" r="14"/>
    <circle cx="80" cy="181" r="10"/>
    <circle cx="110" cy="181" r="10"/>
    <circle cx="144" cy="181" r="14"/>
  </g>
  <g fill="#2b2b2b"><circle cx="42" cy="181" r="4"/><circle cx="144" cy="181" r="4"/></g>
  <!-- corgi head, front-facing, like a smiling engine face -->
  <g stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round">
    <!-- ears -->
    <path d="M160 116 L170 50 L200 96 Z" fill="#e8892b"/>
    <path d="M240 116 L232 50 L202 96 Z" fill="#e8892b"/>
    <!-- head -->
    <path d="M200 86 C232 86 248 112 246 142 C244 176 226 200 200 200 C174 200 156 176 154 142 C152 112 168 86 200 86 Z" fill="#e8892b"/>
  </g>
  <!-- inner ears -->
  <path d="M168 104 L173 66 L190 92 Z" fill="#ffd9c2"/>
  <path d="M232 104 L229 66 L212 92 Z" fill="#ffd9c2"/>
  <!-- white blaze + muzzle -->
  <path d="M200 98 C206 98 208 120 210 132 C228 136 238 152 236 168 C232 188 216 197 200 197 C184 197 168 188 164 168 C162 152 172 136 190 132 C192 120 194 98 200 98 Z" fill="#fff"/>
  <!-- eyes -->
  <ellipse cx="180" cy="134" rx="7" ry="8" fill="#2b2b2b"/>
  <ellipse cx="220" cy="134" rx="7" ry="8" fill="#2b2b2b"/>
  <circle cx="182.5" cy="131" r="2.5" fill="#fff"/>
  <circle cx="222.5" cy="131" r="2.5" fill="#fff"/>
  <!-- eyebrows / cheeks -->
  <circle cx="170" cy="160" r="6" fill="#ff9a9a" opacity=".55"/>
  <circle cx="230" cy="160" r="6" fill="#ff9a9a" opacity=".55"/>
  <!-- nose -->
  <path d="M190 154 C190 148 210 148 210 154 C210 160 204 164 200 164 C196 164 190 160 190 154 Z" fill="#2b2b2b"/>
  <!-- smile + tongue -->
  <path d="M200 164 v6" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M184 170 C190 180 196 178 200 172 C204 178 210 180 216 170" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M194 176 C194 190 206 190 206 176 C203 179 197 179 194 176 Z" fill="#ff6f7d" stroke="#2b2b2b" stroke-width="3"/>
</svg>
